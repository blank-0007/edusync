name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Unit tests (Protocol + Server)
        run: npm test

      - name: End-to-end sync acceptance tests
        run: npm run e2e

      - name: Yjs CRDT document sync acceptance tests
        run: npm run e2e:docs

      - name: Build Web Client
        run: npm run build
